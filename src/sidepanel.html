<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="sidepanel.css" />
    <title>XCapture Assistent</title>
  </head>
  <body>
    <header class="head">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <span class="head-title">Assistent</span>
      <select id="mode" title="Chat-Modus">
        <option value="general">Allgemein</option>
        <option value="savings">Meine Savings</option>
      </select>
    </header>

    <main id="messages">
      <!-- Leerer Zustand -->
      <div id="empty" class="empty">
        <svg viewBox="0 0 96 96" width="72" height="72" aria-hidden="true">
          <defs>
            <linearGradient id="sf1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3a3a40"/><stop offset="100%" stop-color="#232328"/>
            </linearGradient>
            <linearGradient id="sf2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2c2c31"/><stop offset="100%" stop-color="#19191d"/>
            </linearGradient>
            <linearGradient id="sf3" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#333338"/><stop offset="100%" stop-color="#1e1e22"/>
            </linearGradient>
          </defs>
          <g transform="translate(48 50)">
            <polygon points="0,-36 21,-18 27,-2 -26,-21" fill="url(#sf1)"/>
            <polygon points="27,-2 11,28 1,0 -26,-21" fill="url(#sf3)"/>
            <polygon points="-26,-21 1,0 11,28 -8,30 -28,5" fill="url(#sf2)"/>
            <path d="M0,-36 21,-18 27,-2 11,28 -8,30 -28,5 -26,-21z" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
          </g>
        </svg>
        <div class="empty-title">Assistent</div>
        <p class="empty-sub">
          Frag mich zu deiner aktuellen X-Seite, deinen gespeicherten
          Artikeln oder einfach irgendetwas.
        </p>
      </div>
    </main>

    <footer class="composer">
      <div id="ctxChip" class="ctx-chip" hidden>
        <span id="ctxLabel">Artikel angehängt</span>
        <button id="ctxRemove" type="button" aria-label="Kontext entfernen">×</button>
      </div>
      <div class="inputbar">
        <button id="attach" class="iconbtn" type="button" title="Aktuellen X-Artikel anhängen">+</button>
        <textarea id="input" rows="1" placeholder="Frag den Assistenten…"></textarea>
        <button id="send" class="sendbtn" type="button" title="Senden" aria-label="Senden">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3.4 20.4 22 12 3.4 3.6 3.4 10l13 2-13 2z"/></svg>
        </button>
      </div>
      <div id="hint" class="hint"></div>
    </footer>

    <script src="sidepanel.js"></script>
  </body>
</html>
