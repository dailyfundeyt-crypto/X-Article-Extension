<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>XCapture</title>
  </head>
  <body>
    <!-- Brand-Zeile wie auf der Landing Page -->
    <div class="brand">
      <img src="../icons/icon32.png" alt="" width="20" height="20" />
      <span class="brand-name">XCapture</span>
      <span class="badge">v1.0</span>
    </div>

    <!-- Render-Feld: Logo mit Hintergrund (Liquid Glass) -->
    <div class="hero">
      <svg viewBox="0 0 240 150" aria-hidden="true">
        <defs>
          <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
            <path d="M26 0H0v26" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
          </pattern>
          <radialGradient id="glow" cx="50%" cy="46%" r="60%">
            <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
            <stop offset="55%" stop-color="rgba(255,255,255,0.03)"/>
            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
          </radialGradient>
          <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2e2e33"/>
            <stop offset="100%" stop-color="#1c1c20"/>
          </linearGradient>
          <linearGradient id="f2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#222226"/>
            <stop offset="100%" stop-color="#121215"/>
          </linearGradient>
          <linearGradient id="f3" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#28282d"/>
            <stop offset="100%" stop-color="#17171a"/>
          </linearGradient>
        </defs>

        <rect width="240" height="150" fill="#0a0a0c"/>
        <rect width="240" height="150" fill="url(#grid)"/>
        <rect width="240" height="150" fill="url(#glow)"/>

        <!-- Wireframe-Akzent rechts -->
        <g stroke="rgba(255,255,255,0.07)" fill="none" stroke-width="1">
          <path d="M192 38l26 14v30l-26 16-26-16V52z"/>
          <path d="M192 38v60M166 52l52 30M218 52l-52 30"/>
        </g>

        <!-- Facettierter Stein -->
        <g transform="translate(120 76)">
          <polygon points="0,-44 26,-22 33,-2 -32,-26" fill="url(#f1)"/>
          <polygon points="33,-2 14,34 1,0 -32,-26" fill="url(#f3)" transform="translate(0 0)"/>
          <polygon points="-32,-26 1,0 14,34 -10,36 -34,6" fill="url(#f2)"/>
          <path d="M0,-44 26,-22 33,-2 14,34 -10,36 -34,6 -32,-26z"
                fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
          <path d="M0,-44 -32,-26M33,-2 1,0 -32,-26M1,0 14,34"
                fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
        </g>
      </svg>
    </div>

    <button id="saveCurrent" class="btn save">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path fill="currentColor" d="M12 17.41l-5.7-5.7 1.41-1.42L11 13.59V3h2v10.59l3.29-3.3 1.41 1.42-5.7 5.7zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"/>
      </svg>
      Speichern
    </button>

    <button id="openChat" class="btn settings">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M12 3C6.5 3 2 6.9 2 11.7c0 2.7 1.4 5.1 3.7 6.7-.2.8-.7 2-1.6 3 0 0 2.8-.2 4.8-1.7.9.3 2 .5 3.1.5 5.5 0 10-3.9 10-8.5S17.5 3 12 3z"/>
      </svg>
      AI-Chat
    </button>

    <button id="openOptions" class="btn settings">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7.43-1.5c.04-.33.07-.66.07-1s-.03-.67-.07-1l2.11-1.65a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.73-1l-.38-2.65A.5.5 0 0 0 13.96 1h-4a.5.5 0 0 0-.49.42l-.38 2.65c-.62.26-1.2.6-1.73 1l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.5.5 0 0 0 .12.64L4.5 10c-.04.33-.07.66-.07 1s.03.67.07 1l-2.11 1.65a.5.5 0 0 0-.12.64l2 3.46c.13.22.39.31.61.22l2.49-1c.53.4 1.11.74 1.73 1l.38 2.65c.04.24.25.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65a7.3 7.3 0 0 0 1.73-1l2.49 1c.23.09.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64L19.43 12.5z" transform="translate(0 .5)"/>
      </svg>
      Einstellungen
    </button>

    <div id="status" class="status" hidden></div>

    <div class="fine">Frei &amp; Open Source · Chrome, Edge, Brave, Arc</div>

    <script src="popup.js"></script>
  </body>
</html>
